version: "3.9"

services:
  server:
    build:
      context: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env        # Server secrets like JWT_SECRET, DATABASE_URL
    volumes:
      - ./server/uploads:/app/uploads
    # depends_on:
    #   - db    # only if you still need a local DB
    restart: unless-stopped

  client:
    build:
      context: ./client
    env_file:
      - ./client/.env.local  # Only public NEXT_PUBLIC_ variables
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

